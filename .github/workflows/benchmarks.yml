name: Benchmarks

# spell-checker:ignore (people) taiki-e
# spell-checker:ignore (misc) codspeed sccache

on:
  pull_request:
    paths: &bench_paths
      - '.github/workflows/benchmarks.yml'
      - 'src/uu/**'
      - 'src/uucore/**'
      - 'src/uucore_procs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches:
      - main
    paths: *bench_paths

permissions:
  contents: read # to fetch code (actions/checkout)

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detects-benchmarks:
    name: Detect changes on crates
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.detect.outputs.package }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # for push diff of the previous
            base="${{ github.event.before }}"
          fi

          changed=$(git diff --name-only "$base" "${{ github.sha }}")

          if echo "$changed" | grep -Fxq '.github/workflows/benchmarks.yml'; then
            candidates=$(ls src/uu)
          elif echo "$changed" | grep -qE '^(Cargo\.(toml|lock)|src/(uucore|uucore_procs)/)'; then
            candidates=$(ls src/uu)
          else
            candidates=$(echo "$changed" | awk -F'/' '/^src\/uu\// {print $3}' | sort -u)
          fi

          package=$(for pkg in $candidates;
          do
            if [ -d "src/uu/$pkg/benches" ]; then
              echo "uu_$pkg"
            fi
          done | sort -u | jq -R . | jq -sc .)

          echo "package=$package" >> "$GITHUB_OUTPUT"

  benchmarks:
    needs: detects-benchmarks
    if: needs.detects-benchmarks.outputs.package != '[]'
    name: Run memory benchmarks for ${{ matrix.package }} (CodSpeed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CODSPEED_REV: 2152fe2e013cccd5436e788dd4ae41a050d2b861
      CODSPEED_API_URL: https://7j3xul0pqk.execute-api.eu-west-1.amazonaws.com/dev/
      CODSPEED_EXPERIMENTAL_MEMORY_CAPTURE_STACK: "true"
      CODSPEED_LOG: debug
    strategy:
      # Stagger the memory-only jobs: concurrent runners hitting the GitHub cache API
      # (rust-cache + sccache + CodSpeed) at once triggers HTTP 429s.
      max-parallel: 12
      matrix:
        package: ${{ fromJson(needs.detects-benchmarks.outputs.package) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2

      - name: Run sccache-cache
        id: sccache-setup
        uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
      - name: Export sccache
        if: steps.sccache-setup.outcome == 'success'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Install locales
        shell: bash
        run: |
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale

      - name: Install memtrack build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y autopoint bison flex

      - name: Install memtrack
        uses: baptiste0928/cargo-install@v3.5.0
        with:
          crate: memtrack
          git: https://github.com/CodSpeedHQ/codspeed
          commit: ${{ env.CODSPEED_REV }}

      - name: Record memtrack binary
        id: memtrack
        shell: bash
        run: |
          set -euo pipefail
          path="$(command -v codspeed-memtrack)"
          version="$(codspeed-memtrack --version)"
          sha="$(sha256sum "$path" | awk '{print $1}')"
          if [ -z "$path" ] || [ -z "$version" ] || [ -z "$sha" ]; then
            echo "::error::Failed to record codspeed-memtrack path, version, and SHA-256"
            exit 1
          fi
          {
            echo "path=$path"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "codspeed-memtrack path: $path"
          echo "codspeed-memtrack version: $version"
          echo "codspeed-memtrack SHA-256: $sha"

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build memory benchmarks for ${{ matrix.package }}
        shell: bash
        run: |
          echo "Building memory benchmarks for ${{ matrix.package }}"
          cargo codspeed build -m memory -p ${{ matrix.package }}
      - name: Prepare CodSpeed runner install root
        shell: bash
        run: |
          install_root="${{ runner.temp }}/codspeed-runner"
          mkdir -p "$install_root/bin"
          echo "$install_root/bin" >> "$GITHUB_PATH"
      - name: Run memory benchmarks for ${{ matrix.package }}
        uses: CodSpeedHQ/action@v5
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/codspeed-runner
        with:
          mode: memory
          run: |
            echo "Running memory benchmarks for ${{ matrix.package }}"
            cargo codspeed run -p ${{ matrix.package }} > /dev/null
          token: ${{ secrets.CODSPEED_TOKEN }}
          upload-url: https://aiy2l19wii.execute-api.eu-west-1.amazonaws.com/upload
          runner-version: rev:${{ env.CODSPEED_REV }}
          skip-hash-check-warning: true

      - name: Verify memtrack binary was not replaced
        if: always()
        shell: bash
        env:
          RECORDED_MEMTRACK_PATH: ${{ steps.memtrack.outputs.path }}
          RECORDED_MEMTRACK_VERSION: ${{ steps.memtrack.outputs.version }}
          RECORDED_MEMTRACK_SHA: ${{ steps.memtrack.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$RECORDED_MEMTRACK_PATH" ] || \
             [ -z "$RECORDED_MEMTRACK_VERSION" ] || \
             [ -z "$RECORDED_MEMTRACK_SHA" ]; then
            echo "::error::Recorded codspeed-memtrack output is empty"
            exit 1
          fi
          current_path="$(command -v codspeed-memtrack || true)"
          if [ -z "$current_path" ]; then
            echo "::error::codspeed-memtrack is missing after the CodSpeed action"
            exit 1
          fi
          current_version="$(codspeed-memtrack --version)"
          current_sha="$(sha256sum "$current_path" | awk '{print $1}')"
          echo "Recorded codspeed-memtrack path: $RECORDED_MEMTRACK_PATH"
          echo "Recorded codspeed-memtrack version: $RECORDED_MEMTRACK_VERSION"
          echo "Recorded codspeed-memtrack SHA-256: $RECORDED_MEMTRACK_SHA"
          echo "Resolved codspeed-memtrack path: $current_path"
          echo "Resolved codspeed-memtrack version: $current_version"
          echo "Resolved codspeed-memtrack SHA-256: $current_sha"
          if [ "$current_sha" != "$RECORDED_MEMTRACK_SHA" ]; then
            echo "::error::codspeed-memtrack was replaced during the CodSpeed action"
            exit 1
          fi
